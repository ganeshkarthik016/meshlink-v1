[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "p2pchat"
version = "0.1.0"
description = "Serverless LAN chat and file sharing"
requires-python = ">=3.10"
dependencies = ["cryptography", "netifaces>=0.11.0"]

[project.scripts]
meshlink = "p2pchat.__main__:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
